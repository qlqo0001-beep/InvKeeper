# ============================================
# InvKeeper 설정 파일
# ============================================

# keepInventory 게임룰 강제 고정 옵션
# true로 두면 플러그인 로드/월드 로드 시마다 모든 월드의 keepInventory를 false로 강제 설정합니다.
# (인벤토리 복제 버그 방지를 위해 기본값 true 권장, 끄면 복제 버그가 발생할 수 있습니다)
force-keep-inventory-false: true

rules:
  world:
    # 0~100 사이의 값을 사용하세요. 0은 완전 보호, 100은 모든 아이템/경험치를 드랍합니다.
    default:        { inventory-drop-percent: 0,   exp-drop-percent: 0 }
    world:          { inventory-drop-percent: 50,  exp-drop-percent: 50 }
    world_nether:   { inventory-drop-percent: 70,  exp-drop-percent: 70 }
    world_the_end:  { inventory-drop-percent: 100, exp-drop-percent: 100 }

  permissions:
    - permission: "invkeeper.drop.donor"
      priority: 10
      inventory-drop-percent: 30
      exp-drop-percent: 30
    - permission: "invkeeper.drop.vip"
      priority: 50
      inventory-drop-percent: 10
      exp-drop-percent: 10
    - permission: "invkeeper.drop.admin"
      priority: 100
      inventory-drop-percent: 0
      exp-drop-percent: 0

protection-items:
  # 각 보호 아이템은 고유한 키로 정의됩니다.
  # 키는 /invkeeper give <player> <item-key> [amount] 명령어에서 사용됩니다.
  #
  # kind: consumable 또는 timed
  # use-type: mmoitems 또는 vanilla
  # duration-minutes: timed 아이템에만 필요합니다.
  #
  # 하나의 항목은 MMOItems 전용 또는 바닐라 전용 중 하나만 선택하세요.
  # MMOItems와 바닐라 항목을 모두 제공하려면 각각 별도의 키를 정의하세요.
  #
  # 예시:
  # consumable_vanilla:
  #   kind: consumable
  #   use-type: vanilla
  #   vanilla-material: PAPER
  #   vanilla-name: "&b인벤토리 보호권 &7(소모용)"
  #   vanilla-lore:
  #     - "&7소지만 하고 있으면"
  #     - "&7사망 시 &f자동으로 소모&7되어"
  #     - "&7인벤토리와 경험치를 &a완전히 보호&7합니다."
  #     - ""
  #     - "&e[자동 발동]"
  #
  # consumable_mmo:
  #   kind: consumable
  #   use-type: mmoitems
  #   mmoitems-type: "consumable"
  #   mmoitems-id: "인벤토리보호권_소모형"
  #
  # timed_vanilla:
  #   kind: timed
  #   use-type: vanilla
  #   duration-minutes: 30
  #   vanilla-material: PAPER
  #   vanilla-name: "&b인벤토리 보호권 &7(시간형)"
  #   vanilla-lore:
  #     - "&7우클릭하여 사용하면"
  #     - "&e{duration}분간&7 사망해도"
  #     - "&7인벤토리와 경험치를 &a보호&7합니다."
  #     - ""
  #     - "&e[우클릭 사용]"
  #
  # timed_mmo:
  #   kind: timed
  #   use-type: mmoitems
  #   duration-minutes: 30
  #   mmoitems-type: "consumable"
  #   mmoitems-id: "인벤토리보호권_시간형"

  test_소모1_vanilla:
    kind: consumable
    use-type: vanilla
    vanilla-material: PAPER
    vanilla-name: "&b인벤토리 보호권 &7(소모용)"
    vanilla-lore:
      - "&7소지만 하고 있으면"
      - "&7사망 시 &f자동으로 소모&7되어"
      - "&7인벤토리와 경험치를 &a완전히 보호&7합니다."
      - ""
      - "&e[자동 발동]"
    # custom-model-data: 1001

  test_소모1_mmo:
    kind: consumable
    use-type: mmoitems
    mmoitems-type: "consumable"
    mmoitems-id: "인벤토리보호권_소모형"

  test_시간1_vanilla:
    kind: timed
    use-type: vanilla
    duration-minutes: 30
    vanilla-material: PAPER
    vanilla-name: "&b인벤토리 보호권 &7(시간형)"
    vanilla-lore:
      - "&7우클릭하여 사용하면"
      - "&e{duration}분간&7 사망해도"
      - "&7인벤토리와 경험치를 &a보호&7합니다."
      - ""
      - "&e[우클릭 사용]"
    # custom-model-data: 1002

  test_시간1_mmo:
    kind: timed
    use-type: mmoitems
    duration-minutes: 30
    mmoitems-type: "consumable"
    mmoitems-id: "인벤토리보호권_시간형"

messages:
  death: "&c인벤토리 {inv_percent}%, 경험치 {exp_percent}%를 잃었습니다. 아이템 {items_dropped}개, 경험치 {exp_dropped}점 손실"
  protected: "&a보호 아이템 덕분에 아무것도 잃지 않았습니다!"
  timed-already-active: "&e이미 보호 상태입니다. (남은 시간: {remaining})"
  timed-activated: "&a인벤토리 보호가 {duration}분간 활성화되었습니다."
  timed-remaining-five-minutes: "&e보호 상태가 5분 남았습니다. 남은 시간: {remaining}"
  timed-remaining-one-minute: "&e보호 상태가 1분 남았습니다. 남은 시간: {remaining}"
