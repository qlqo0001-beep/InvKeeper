name: InvKeeper
version: '1.4.1'
main: com.invkeeper.InvKeeperPlugin
api-version: '1.21'
softdepend: [MMOItems]
author: InvKeeperDev
description: 사망 시 인벤토리/경험치를 월드, 권한, 보호 아이템 기준으로 관리하는 플러그인

commands:
  invkeeper:
    description: InvKeeper 관리 명령어
    usage: /<command> [status|reload|give|soulbind|grave]
    aliases: [ik]

permissions:
  invkeeper.status:
    description: 자신의 InvKeeper 보호 상태를 확인할 수 있는 권한
    default: true
  invkeeper.admin:
    description: InvKeeper 관리 권한 (reload, give, soulbind unbind/inspect)
    default: op
  invkeeper.grave.admin:
    description: 무덤 관리 권한 (list, history, reload)
    default: op
  invkeeper.grave.bypass:
    description: 무덤을 도굴 아이템 없이 강제 오픈 가능
    default: op
  invkeeper.grave.time.vip:
    description: VIP 무덤 만료 시간 등급
    default: false
  invkeeper.grave.time.vvip:
    description: VVIP 무덤 만료 시간 등급 (무제한)
    default: false
  invkeeper.drop.1:
    description: 드랍 규칙 등급 1 적용 권한
    default: false
  invkeeper.drop.2:
    description: 드랍 규칙 등급 2 적용 권한
    default: false
  invkeeper.drop.3:
    description: 드랍 규칙 등급 3 적용 권한
    default: false
  invkeeper.drop.4:
    description: 드랍 규칙 등급 4 적용 권한
    default: false
  invkeeper.drop.5:
    description: 드랍 규칙 등급 5 적용 권한
    default: false
  invkeeper.drop.6:
    description: 드랍 규칙 등급 6 적용 권한
    default: false
  invkeeper.drop.7:
    description: 드랍 규칙 등급 7 적용 권한
    default: false
  invkeeper.drop.8:
    description: 드랍 규칙 등급 8 적용 권한
    default: false
  invkeeper.drop.9:
    description: 드랍 규칙 등급 9 적용 권한
    default: false
  invkeeper.drop.10:
    description: 드랍 규칙 등급 10 적용 권한
    default: false
  invkeeper.drop.11:
    description: 드랍 규칙 등급 11 적용 권한
    default: false
  invkeeper.soulbind.bypass:
    description: 다른 플레이어의 각인 아이템을 획득/이동할 수 있는 권한
    default: false
