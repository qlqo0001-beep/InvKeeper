# keepInventory 게임룰 강제 고정 옵션
# true로 두면 플러그인 로드/월드 로드 시마다 모든 월드의 keepInventory를 false로 강제 설정합니다.
# 인벤토리 복제 버그 방지를 위해 기본값 true 권장합니다.
force-keep-inventory-false: true

# 영혼각인(소울바인드) 만료 검사를 몇 개의 배치로 나눠서 수행할지 설정합니다.
# 서버는 매초 접속자 전원을 이 값만큼의 그룹으로 나눠, 매초 한 그룹씩만 순환 검사합니다.
# (예: 값이 5면, 100명이 있을 때 매초 약 20명씩만 검사하고 5초에 걸쳐 전원을 한 바퀴 돕니다.)
#
# - 값을 올리면: 한 틱에 검사하는 인원이 줄어 서버 부하(순간 렉)는 낮아지지만,
#   개별 아이템의 각인 만료가 화면에 반영되기까지 걸리는 시간(최대 값 초)이 길어집니다.
# - 값을 내리면: 반영은 빨라지지만 한 틱당 부하가 커집니다.
# 각인 만료 반영이 몇 초 늦어도 게임플레이에는 지장이 없으므로, 인원이 많을수록
# 값을 올려 부하를 분산시키는 것을 권장합니다.
#
# 권장값 (동시 접속자 수 기준):
#   ~20명    : 1   (매초 전원 검사해도 부담 없음)
#   ~50명    : 3
#   ~100명   : 5   (기본값)
#   ~200명   : 8~10
#   ~500명   : 15~20
#
# 최소값은 1입니다. 1보다 작게 설정하면 자동으로 1로 보정됩니다.
soulbind-scan-batches: 5

# 타임존 설정
# 각인 만료 시간 표시에 사용되는 시간대입니다.
# 사용 가능한 타임존 목록: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
# (TZ database name 컬럼 참고)
# 기본값: Asia/Seoul
timezone: "Asia/Seoul"

# 아이템에 할당 가능한 최대 스택 수
# 스택형 각인 도구로 아이템에 각인을 적용할 때, 이 값을 초과하는 스택은
# 자동으로 이 값으로 제한됩니다.
# - -1: 무제한 (제한 없음, 기본값)
# - 양수: 해당 값이 최대 스택 수 (도구의 soulbind-stacks가 이 값보다 크면 제한됨)
max-soulbind-stack: -1

# 각인 아이템 픽업 차단 메시지 표시 쿨다운 (초)
# 다른 플레이어의 각인 아이템을 주우려고 할 때, 메시지가 너무 자주 표시되는 것을 방지합니다.
# 이 값(초)이 지나야 동일한 플레이어에게 다시 메시지가 표시됩니다.
# - 0: 쿨다운 없음 (매번 메시지 표시)
# - 양수: 해당 초 이후에만 메시지 표시 (기본값: 5)
soulbind-pickup-message-cooldown-seconds: 5

# 각인 아이템 사용(우클릭/채굴/설치/공격/발사 등) 차단 메시지 쿨다운 (초)
# 비소유자가 남의 각인 아이템을 사용하려고 할 때, 메시지가 너무 자주 표시되는 것을 방지합니다.
# 이 값(초)이 지나야 동일한 플레이어에게 다시 메시지가 표시됩니다.
# - 0: 쿨다운 없음 (매번 메시지 표시)
# - 양수: 해당 초 이후에만 메시지 표시 (기본값: 3)
soulbind-use-message-cooldown-seconds: 3

# PvP(다른 플레이어에게 사망) 설정
# 다른 플레이어에게 죽은 경우 PvP 사망으로 판정합니다. (자기 화살/TNT 등 자기 자신에 의한 사망은 PvE로 취급)
# PvP 사망 시 드랍률은 아래 rules의 pvp-inventory-drop-percent / pvp-exp-drop-percent를 사용하며,
# 이 값이 없는 규칙은 일반 드랍률과 동일하게 적용됩니다.
pvp:
  # PvP 사망 시에도 보호권(소모형/시간형)이 작동할지 여부
  # false면 PvP로 죽었을 때 보호권이 발동하지 않고(소모되지도 않음) PvP 드랍률대로 잃습니다.
  protection-items-work: true

# 위험 지역 안내
# 접속 시 1회, 그리고 월드 이동 시 적용 드랍률이 이전과 달라졌을 때만 채팅으로 안내합니다.
# (권한 규칙이 월드 규칙을 덮어써서 드랍률이 같다면 월드를 옮겨도 다시 안내하지 않습니다)
# 플레이어는 /invkeeper notice [on|off] 로 개인적으로 끄고 켤 수 있습니다.
danger-notice:
  # false면 서버 전체에서 안내하지 않습니다. (개인 설정과 관계없이)
  enabled: true

rules:
  world:
    # 0~100 사이의 값을 사용하세요. 0은 완전 보호, 100은 모든 아이템/경험치를 드랍합니다.
    # PvP 사망 시 드랍률을 따로 두려면 pvp-inventory-drop-percent / pvp-exp-drop-percent를 추가하세요. (생략 시 일반 값과 동일)
    # 예) world: { inventory-drop-percent: 50, exp-drop-percent: 50, pvp-inventory-drop-percent: 80, pvp-exp-drop-percent: 80 }
    default:        { inventory-drop-percent: 0,   exp-drop-percent: 0 }
    world:          { inventory-drop-percent: 50,  exp-drop-percent: 50 }
    world_nether:   { inventory-drop-percent: 70,  exp-drop-percent: 70 }
    world_the_end:  { inventory-drop-percent: 100, exp-drop-percent: 100 }

  permissions:
    # priority가 높은 규칙이 우선 적용됩니다.
    # 월드 규칙과 마찬가지로 pvp-inventory-drop-percent / pvp-exp-drop-percent를 추가할 수 있습니다. (생략 시 일반 값과 동일)
    # 어떤 규칙이 적용될지는 PvP 여부와 관계없이 priority로 결정되고, PvP 사망이면 그 규칙의 pvp 값이 쓰입니다.
    - permission: "invkeeper.drop.1"
      priority: 10
      inventory-drop-percent: 100
      exp-drop-percent: 100
    - permission: "invkeeper.drop.2"
      priority: 20
      inventory-drop-percent: 90
      exp-drop-percent: 90
    - permission: "invkeeper.drop.3"
      priority: 30
      inventory-drop-percent: 80
      exp-drop-percent: 80
    - permission: "invkeeper.drop.4"
      priority: 40
      inventory-drop-percent: 70
      exp-drop-percent: 70
    - permission: "invkeeper.drop.5"
      priority: 50
      inventory-drop-percent: 60
      exp-drop-percent: 60
    - permission: "invkeeper.drop.6"
      priority: 60
      inventory-drop-percent: 50
      exp-drop-percent: 50
    - permission: "invkeeper.drop.7"
      priority: 70
      inventory-drop-percent: 40
      exp-drop-percent: 40
    - permission: "invkeeper.drop.8"
      priority: 80
      inventory-drop-percent: 30
      exp-drop-percent: 30
    - permission: "invkeeper.drop.9"
      priority: 90
      inventory-drop-percent: 20
      exp-drop-percent: 20
    - permission: "invkeeper.drop.10"
      priority: 95
      inventory-drop-percent: 10
      exp-drop-percent: 10
    - permission: "invkeeper.drop.11"
      priority: 100
      inventory-drop-percent: 0
      exp-drop-percent: 0
# ============================================
# 무덤(Grave) 시스템 설정
# ============================================
# 플레이어 사망 시 아이템/경험치를 바닥에 흩뿌리는 대신, 사망 지점에 무덤(기본: 통 블록)을
# 생성해 보관합니다. 위 rules(월드/권한별 드랍 비율) 설정은 이 기능이 켜져 있어도 그대로
# "얼마나 잃는지" 계산에 사용되며, 다만 잃는 몫이 바닥에 드랍되는 대신 무덤에 담깁니다.
# 무덤 주인은 언제든 우클릭해 열람/회수할 수 있고, 다른 플레이어는 도굴 아이템
# (items.yml의 kind: GRAVE_LOOT_TOOL, 예: grave_loot_vanilla)으로 일정 시간 도굴을
# 시전해야 열 수 있습니다. 도굴 도중 무덤 주인이 무덤을 열면 도굴은 자동으로 취소됩니다.

grave:
  # 무덤 시스템 전체 스위치.
  # false로 두면 무덤을 전혀 생성하지 않고 기존 방식(바닥 드랍)으로 되돌아갑니다.
  enabled: true

  # 무덤으로 사용할 블록 설정
  container:
    # VANILLA: 바닐라 Material을 무덤 블록으로 사용합니다. (현재 실제로 동작하는 유일한 값)
    # CUSTOM_BLOCK: ItemsAdder/Oraxen 등 커스텀 블록 연동을 위해 예약된 값입니다.
    #   ⚠ 아직 구현되어 있지 않습니다. CUSTOM_BLOCK으로 바꿔도 현재 버전에서는
    #      항상 아래 vanilla-material 기준으로 동작합니다.
    type: VANILLA
    # 실제로 배치할 바닐라 블록 (Material Enum 이름). 예: BARREL, CHEST, SHULKER_BOX
    # 어디까지나 장식용 블록이며, 아이템은 이 블록의 실제 인벤토리가 아니라 플러그인이
    # 자체 관리하는 가상 GUI(무덤 데이터)에 저장됩니다. 후퍼로 빨아들일 실제 내용물이 없습니다.
    vanilla-material: BARREL
    # type: CUSTOM_BLOCK 전용, 커스텀 블록 ID (예약됨, 미구현)
    custom-block-id: ""
    # type: CUSTOM_BLOCK 전용, 블록을 제공하는 플러그인 이름 (예약됨, 미구현)
    custom-block-provider: ""

  # 무덤 GUI 타이틀에 쓰일 형식 문자열.
  # ⚠ 현재 버전에서는 사용되지 않는 항목입니다. 실제 GUI 타이틀은 gui.yml의
  #    grave-gui.title 값이 사용됩니다. (동일 목적의 설정이 중복 정의되어 있는 상태)
  title-format: "{player} 의 무덤 {death_time}"
  # title-format의 {death_time} 자리에 들어갈 날짜/시간 표기 형식.
  # ⚠ title-format과 마찬가지로 현재 버전에서는 사용되지 않습니다.
  death-time-format: "{year}-{month}-{day} {hour}:{minute}"

  # 플레이어 1인당 동시에 존재 가능한 최대 무덤 개수.
  # 초과 상태에서 새 무덤이 생성되면 가장 오래된 무덤을 먼저 정리(히스토리에는 기록됨)한 뒤
  # 새 무덤을 만듭니다. 이때 messages.yml의 grave-max-reached 메시지가 전송됩니다.
  # 0 이하로 설정하면 개수 제한이 없습니다.
  max-graves-per-player: 5

  # 무덤 자동 만료(시간 경과 시 소멸) 설정
  expire:
    # false면 무덤이 시간이 지나도 사라지지 않습니다. (default-seconds/permission-overrides 무시)
    enabled: true
    # 무덤 생성 후 이 시간(초)이 지나면 자동으로 소멸합니다. (소멸 시 히스토리에 기록됨)
    # 0 또는 -1을 넣으면 무제한(만료 없음)으로 처리됩니다.
    default-seconds: 3600
    # 특정 권한을 가진 플레이어에게는 다른 만료 시간을 적용합니다.
    # 여러 권한을 동시에 만족하면 priority 값이 가장 높은 규칙 하나만 적용됩니다.
    # (아래 rules.permissions와 동일한 "priority 높은 순 우선" 방식)
    permission-overrides:
      - permission: "invkeeper.grave.time.vip"
        priority: 10
        seconds: 7200          # 2시간 뒤 만료
      - permission: "invkeeper.grave.time.vvip"
        priority: 20
        seconds: -1             # 무제한 (만료 없음)

  # 무덤 히스토리(이력) 보관 설정.
  # /invkeeper grave history <player> 명령으로 어드민이 조회하는 기록입니다.
  # 무덤이 사라질 때(주인 전량 회수 / 도굴 완료 / 자동 만료 등) 사망 시점 원본 아이템
  # 스냅샷과 회수 상태(회수됨/도굴됨/미회수)가 함께 저장되며, 어드민은 히스토리에서
  # 어떤 상태의 무덤이든 원본 그대로의 가상 GUI를 열어 아이템을 회수할 수 있습니다.
  history:
    # 히스토리 기록 보관 기간(일). 이 기간이 지난 기록은 자동 삭제됩니다.
    # 0 이하로 설정하면 기간 제한 없이 보관합니다. (max-entries-per-player로만 정리됨)
    retention-days: 30
    # 플레이어 1인당 보관할 최대 히스토리 기록 개수. 초과분은 오래된 순으로 삭제됩니다.
    # 0 이하로 설정하면 개수 제한이 없습니다.
    max-entries-per-player: 50

  # 무덤 시스템을 적용하지 않을 월드 목록 (월드 이름, 대소문자 구분 없이 비교됩니다).
  # 여기 포함된 월드에서 사망하면 무덤이 생성되지 않고, rules 설정에 따라 기존 방식대로
  # 처리됩니다(드랍 비율이 0%면 아무것도 잃지 않고, 그 외에는 바닥에 드랍됩니다).
  # 예: ["world_the_end", "minigame_world"]
  disabled-worlds: []

  # 무덤 위에 표시되는 홀로그램(TextDisplay 엔티티) 설정
  hologram:
    # 홀로그램 표시 여부
    enabled: true
    # 무덤 블록 기준 홀로그램이 뜰 높이 오프셋 (블록 단위, 소수점 가능)
    offset-y: 1.0
    # 홀로그램 텍스트(남은 시간 등)를 갱신하는 주기 (틱 단위, 20틱 = 1초)
    # 값을 낮추면 더 자주 갱신되지만 서버 부하가 늘어나므로, 20(1초) 미만으로는
    # 낮추지 않는 것을 권장합니다.
    update-interval-ticks: 20
    # 무덤이 정상(ACTIVE) 상태이고 만료 시간이 설정되어 있을 때 첫 줄 형식.
    # 사용 가능한 placeholder: {player} 무덤 주인 이름 / {remaining} 남은 만료 시간(예: "12분 34초")
    line-format: "{player} 의 무덤 {remaining}"
    # 무덤이 정상 상태이고 만료가 무제한(expire.default-seconds가 0/-1 또는 해당
    # 권한의 seconds가 -1)일 때 첫 줄 형식. 사용 가능한 placeholder: {player}
    line-format-unlimited: "{player} 의 무덤"
    # 무덤이 도굴 시전 중(BEING_LOOTED)일 때 표시되는 둘째 줄 형식.
    # 사용 가능한 placeholder: {remaining} 도굴 완료까지 남은 시간
    looting-line-format: "도굴중 {remaining}"
    # 도굴이 완료(LOOTED)된 이후 표시되는 둘째 줄 형식.
    # 사용 가능한 placeholder: {looter} 도굴한 플레이어 이름 / {owner} 무덤 주인 이름
    looted-line-format: "{looter}님이 도굴을 한 {owner}의 무덤"
    # 무덤 자물쇠(items.yml의 kind: GRAVE_LOCK)로 도굴이 잠겨 있는 동안 표시되는 둘째 줄 형식.
    # 사용 가능한 placeholder: {remaining} 잠금 해제까지 남은 시간
    locked-line-format: "&6[잠김] {remaining}"

  # 무덤 블록 보호 설정
  # ⚠ 현재 버전에서는 이 항목들이 아직 코드와 연결되어 있지 않습니다.
  #    무덤 블록의 파괴/폭발/피스톤 밀림 방지는 아래 값과 관계없이 항상 적용되고,
  #    prevent-hopper는 대응하는 기능 자체가 아직 구현되어 있지 않습니다.
  #    (참고: 무덤 블록은 장식용일 뿐 실제 아이템이 담긴 인벤토리가 아니므로,
  #     후퍼가 흡입해도 원래부터 빼낼 아이템이 없습니다)
  protection:
    # 무덤 블록을 채굴/파괴하지 못하도록 방지
    prevent-block-break: true
    # 폭발(TNT, 크리퍼, 엔더 크리스탈 등)로 무덤 블록이 파괴되지 않도록 방지
    prevent-explosion: true
    # 피스톤이 무덤 블록을 밀거나 당기지 못하도록 방지
    prevent-piston: true
    # 후퍼가 무덤 블록에서 아이템을 빨아들이지 못하도록 방지 (예약됨, 미구현)
    prevent-hopper: true