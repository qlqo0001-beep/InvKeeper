# ============================================
# InvKeeper 아이템 설정
# ============================================
#
# 아이템 종류 (kind):
#   CONSUMABLE_PROTECTION    - 소모형 보호권 (사망 시 자동 소모되어 완전 보호)
#   TIMED_PROTECTION         - 시간형 보호권 (우클릭으로 일정 시간 보호)
#   SOULBIND_TOOL_TIME       - 시간형 각인 도구 (아이템에 시간 기반 각인 적용)
#   SOULBIND_TOOL_STACK      - 스택형 각인 도구 (아이템에 스택 기반 각인 적용)
#   SOULBIND_UNBIND_TOOL     - 영혼각인 해제 도구 (각인 제거)
#   GRAVE_LOOT_TOOL          - 도굴 도구 (손에 들고 남의 무덤을 우클릭하여 도굴 시전)
#   GRAVE_LOCK               - 무덤 자물쇠 (사망 시 소지하고 있으면 1개 소모되어 무덤에 자물쇠가 걸림)
#
# 각인 도구 설정:
#   SOULBIND_TOOL_TIME:
#     soulbind-duration: 각인 지속 시간 (분 단위)
#       - 0 또는 -1: 영구 각인
#       - 양수: 지정된 시간(분) 후 만료
#
#   SOULBIND_TOOL_STACK:
#     soulbind-stacks: 각인 스택 수
#       - 1: 기본값 (사망 1회 버팀)
#       - 양수: 해당 횟수만큼 사망을 버틸 수 있음
#       - -1: 무한 (사망해도 각인 유지)
#
#   참고: 시간형 각인과 스택형 각인은 동시에 적용할 수 없습니다.
#         이미 각인된 아이템에 다른 타입의 각인을 적용하면 거부됩니다.
#
# use-type: 
#   vanilla - 마인크래프트 기본 아이템 (material, name, lore 사용)
#   mmoitems - MMOItems 플러그인 아이템 (mmoitems-type, mmoitems-id 사용)
#
# soulbind (도구 자체의 각인 설정):
#   enabled: true/false - 각인 활성화 여부
#   duration-minutes: 각인 지속 시간 (분 단위)
#     - 0 또는 -1: 영구 각인 (infinite 자동 적용)
#     - 양수: 지정된 시간(분) 후 만료
#
#
# 참고:
#   - 모든 아이템에 soulbind를 설정할 수 있습니다.
#   - SOULBIND_TOOL_TIME, SOULBIND_TOOL_STACK, SOULBIND_UNBIND_TOOL도
#     soulbind를 설정하면 도구 자체가 각인되어 거래, 드랍, 픽업이 제한됩니다.
#   - CONSUMABLE_PROTECTION과 TIMED_PROTECTION은 보호 아이템 자체에 각인을 적용합니다.
#   - SOULBIND_TOOL_TIME의 soulbind는 도구 자체의 각인이고, soulbind-duration은
#     이 도구로 다른 아이템에 적용할 각인의 시간입니다.
#   - SOULBIND_TOOL_STACK의 soulbind는 도구 자체의 각인이고, soulbind-stacks는
#     이 도구로 다른 아이템에 적용할 각인의 스택 수입니다.
#   - duration-minutes: 0 또는 -1 = 영구 각인
#   - duration-minutes: 60 = 60분 각인
#
# ============================================

items:
  # ============================================
  # 소모형 보호권
  # ============================================

  # 소모형 보호권 (바닐라)
  consumable_vanilla:
    kind: CONSUMABLE_PROTECTION
    use-type: vanilla
    vanilla-material: PAPER
    vanilla-name: "&b인벤토리 보호권 &7(소모용)"
    vanilla-lore:
      - "&7소지만 하고 있으면"
      - "&7사망 시 &f자동으로 소모&7되어"
      - "&7인벤토리와 경험치를 &a완전히 보호&7합니다."
      - ""
      - "&e[자동 발동]"
    soulbind:
      enabled: true
      duration-minutes: 0

  # 소모형 보호권 (MMOItems)
  consumable_mmo:
    kind: CONSUMABLE_PROTECTION
    use-type: mmoitems
    mmoitems-type: "consumable"
    mmoitems-id: "인벤토리보호권_소모형"
    soulbind:
      enabled: true
      duration-minutes: 0

  # ============================================
  # 시간형 보호권
  # ============================================

  # 시간형 보호권 (바닐라)
  timed_vanilla:
    kind: TIMED_PROTECTION
    use-type: vanilla
    duration-minutes: 30
    vanilla-material: PAPER
    vanilla-name: "&b인벤토리 보호권 &7(시간형)"
    vanilla-lore:
      - "&7우클릭하여 사용하면"
      - "&e{duration}분간&7 사망해도"
      - "&7인벤토리와 경험치를 &a보호&7합니다."
      - ""
      - "&e[우클릭 사용]"
    soulbind:
      enabled: true
      duration-minutes: 0

  # 시간형 보호권 (MMOItems)
  timed_mmo:
    kind: TIMED_PROTECTION
    use-type: mmoitems
    duration-minutes: 30
    mmoitems-type: "consumable"
    mmoitems-id: "인벤토리보호권_시간형"
    soulbind:
      enabled: true
      duration-minutes: 0

  # ============================================
  # 시간형 각인 도구
  # ============================================

  # 시간형 각인기 (바닐라)
  soulbind_tool_time_vanilla:
    kind: SOULBIND_TOOL_TIME
    use-type: vanilla
    # 이 도구로 다른 아이템에 적용할 각인의 지속 시간 (분)
    soulbind-duration: 60
    vanilla-material: amethyst_shard
    vanilla-name: "&d시간형 각인기"
    vanilla-lore:
      - "&7다른 아이템 위에 드래그-드랍하여"
      - "&7해당 스택 전체에 시간형 영혼각인을 적용합니다."
      - ""
      - "&e[드래그-드랍 사용]"
    soulbind:
      enabled: true
      duration-minutes: 0

  # 시간형 각인기 (MMOItems)
  soulbind_tool_time_mmo:
    kind: SOULBIND_TOOL_TIME
    use-type: mmoitems
    soulbind-duration: 60
    mmoitems-type: "consumable"
    mmoitems-id: "시간형각인기"
    soulbind:
      enabled: true
      duration-minutes: 0

  # ============================================
  # 스택형 각인 도구
  # ============================================

  # 스택형 각인기 (바닐라)
  soulbind_tool_stack_vanilla:
    kind: SOULBIND_TOOL_STACK
    use-type: vanilla
    # 이 도구로 다른 아이템에 적용할 각인의 스택 수
    soulbind-stacks: 1
    vanilla-material: heart_of_the_sea
    vanilla-name: "&b스택형 각인기"
    vanilla-lore:
      - "&7다른 아이템 위에 드래그-드랍하여"
      - "&7해당 스택 전체에 스택형 영혼각인을 적용합니다."
      - "&7(사망 시 스택 1 소모, 0이면 해제)"
      - ""
      - "&e[드래그-드랍 사용]"
    soulbind:
      enabled: true
      duration-minutes: 0

  # 스택형 각인기 (MMOItems)
  soulbind_tool_stack_mmo:
    kind: SOULBIND_TOOL_STACK
    use-type: mmoitems
    soulbind-stacks: 1
    mmoitems-type: "consumable"
    mmoitems-id: "스택형각인기"
    soulbind:
      enabled: true
      duration-minutes: 0

  # ============================================
  # 각인 해제 도구
  # ============================================

  # 각인 해제기 (바닐라)
  soulbind_unbind_vanilla:
    kind: SOULBIND_UNBIND_TOOL
    use-type: vanilla
    vanilla-material: SHEARS
    vanilla-name: "&c각인 해제 도구"
    vanilla-lore:
      - "&7각인된 아이템 위에 드래그-드랍하여"
      - "&7영혼각인을 &c해제&7합니다."
      - ""
      - "&e[드래그-드랍 사용]"
    soulbind:
      enabled: true
      duration-minutes: 0

  # 각인 해제기 (MMOItems)
  soulbind_unbind_mmo:
    kind: SOULBIND_UNBIND_TOOL
    use-type: mmoitems
    mmoitems-type: "consumable"
    mmoitems-id: "각인해제기"
    soulbind:
      enabled: true
      duration-minutes: 0
  # ============================================
  # 도굴 아이템
  # ============================================

  grave_loot_vanilla:
    kind: GRAVE_LOOT_TOOL
    cast-time-seconds: 300
    use-type: vanilla
    vanilla-material: TRIPWIRE_HOOK
    vanilla-name: "&5도굴 도구"
    vanilla-lore:
      - "&7무덤을 우클릭하면"
      - "&7{duration}초 후 무덤을 도굴할 수 있습니다."

  # ============================================
  # 무덤 자물쇠
  # ============================================
  # 사망 시 인벤토리에 있으면 1개가 자동으로 소모되어, 생성되는 무덤에 자물쇠가 걸립니다.
  # (보호권이 발동했거나 잃은 것이 없어 무덤이 생성되지 않으면 소모되지 않습니다)
  #   lock-seconds:       사망 후 이 시간(초) 동안 다른 플레이어가 도굴을 시작할 수 없음 (0 = 미적용)
  #   extra-cast-seconds: 도굴 시전 시간이 이만큼(초) 늘어남 (0 = 미적용)
  # 두 값을 동시에 설정할 수 있습니다. 로어에서 {lock_seconds}, {extra_cast_seconds} 사용 가능.
  # soulbind를 켜두면 자물쇠 자체가 무덤에 담기거나 남에게 넘어가지 않습니다.

  grave_lock_vanilla:
    kind: GRAVE_LOCK
    use-type: vanilla
    lock-seconds: 300
    extra-cast-seconds: 120
    vanilla-material: IRON_BARS
    vanilla-name: "&6무덤 자물쇠"
    vanilla-lore:
      - "&7소지한 채 사망하면 자동으로 소모되어"
      - "&7무덤에 자물쇠를 겁니다."
      - ""
      - "&f사망 후 &e{lock_seconds}초&f간 도굴 불가"
      - "&f도굴 시간 &e+{extra_cast_seconds}초"
      - ""
      - "&e[자동 발동]"
    soulbind:
      enabled: true
      duration-minutes: 0
