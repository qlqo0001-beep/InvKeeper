# ============================================
# InvKeeper 아이템 설정
# ============================================
#
# 아이템 종류 (kind):
#   CONSUMABLE_PROTECTION  - 소모형 보호권 (사망 시 자동 소모되어 완전 보호)
#   TIMED_PROTECTION       - 시간형 보호권 (우클릭으로 일정 시간 보호)
#   SOULBIND_TOOL          - 영혼각인 도구 (아이템에 소유자 각인 적용)
#   SOULBIND_UNBIND_TOOL   - 영혼각인 해제 도구 (각인 제거)
#
# soulbind-apply-duration (각인 적용 시간):
#   SOULBIND_TOOL에서만 사용되는 설정
#   이 도구로 다른 아이템에 각인을 적용할 때의 지속 시간 (분 단위)
#   - 0 또는 -1: 영구 각인 적용
#   - 양수: 지정된 시간(분) 동안 각인 유지
#
# use-type: 
#   vanilla - 마인크래프트 기본 아이템 (material, name, lore 사용)
#   mmoitems - MMOItems 플러그인 아이템 (mmoitems-type, mmoitems-id 사용)
#
# soulbind (각인 설정):
#   enabled: true/false - 각인 활성화 여부
#   duration-minutes: 각인 지속 시간 (분 단위)
#     - 0 또는 -1: 영구 각인 (infinite 자동 적용)
#     - 양수: 지정된 시간(분) 후 만료
#
#
# 참고:
#   - 모든 아이템에 soulbind를 설정할 수 있습니다.
#   - SOULBIND_TOOL과 SOULBIND_UNBIND_TOOL도 soulbind를 설정하면 도구 자체가 각인되어
#     거래, 드랍, 픽업이 제한됩니다. (소유자만 사용 가능)
#   - CONSUMABLE_PROTECTION과 TIMED_PROTECTION은 보호 아이템 자체에 각인을 적용합니다.
#   - SOULBIND_TOOL의 soulbind는 도구 자체의 각인이고, soulbind-apply-duration은
#     이 도구로 다른 아이템에 적용할 각인의 시간입니다.
#   - duration-minutes: 0 또는 -1 = 영구 각인
#   - duration-minutes: 60 = 60분 각인
#
# ============================================

items:
  consumable_vanilla:
    kind: CONSUMABLE_PROTECTION
    use-type: vanilla
    vanilla-material: PAPER
    vanilla-name: "&b인벤토리 보호권 &7(소모용)"
    vanilla-lore:
      - "&7소지만 하고 있으면"
      - "&7사망 시 &f자동으로 소모&7되어"
      - "&7인벤토리와 경험치를 &a완전히 보호&7합니다."
      - ""
      - "&e[자동 발동]"
    soulbind:
      enabled: true
      duration-minutes: 0

  consumable_mmo:
    kind: CONSUMABLE_PROTECTION
    use-type: mmoitems
    mmoitems-type: "consumable"
    mmoitems-id: "인벤토리보호권_소모형"
    soulbind:
      enabled: true
      duration-minutes: 0

  timed_vanilla:
    kind: TIMED_PROTECTION
    use-type: vanilla
    duration-minutes: 30
    vanilla-material: PAPER
    vanilla-name: "&b인벤토리 보호권 &7(시간형)"
    vanilla-lore:
      - "&7우클릭하여 사용하면"
      - "&e{duration}분간&7 사망해도"
      - "&7인벤토리와 경험치를 &a보호&7합니다."
      - ""
      - "&e[우클릭 사용]"
    soulbind:
      enabled: true
      duration-minutes: 0

  timed_mmo:
    kind: TIMED_PROTECTION
    use-type: mmoitems
    duration-minutes: 30
    mmoitems-type: "consumable"
    mmoitems-id: "인벤토리보호권_시간형"
    soulbind:
      enabled: true
      duration-minutes: 0

  soulbind_tool_vanilla:
    kind: SOULBIND_TOOL
    use-type: vanilla
    # 이 도구로 다른 아이템에 적용할 각인의 지속 시간
    soulbind-apply-duration: 60
    vanilla-material: amethyst_shard
    vanilla-name: "&d영혼 각인기"
    vanilla-lore:
      - "&7다른 아이템 위에 드래그-드랍하여"
      - "&7해당 스택 전체에 영혼각인을 적용합니다."
      - ""
      - "&e[드래그-드랍 사용]"
    soulbind:
      enabled: true
      duration-minutes: 0


  soulbind_tool_mmo:
    kind: SOULBIND_TOOL
    use-type: mmoitems
    soulbind-apply-duration: 60
    mmoitems-type: "consumable"
    mmoitems-id: "영혼각인기"
    soulbind:
      enabled: true
      duration-minutes: 0

  soulbind_unbind_vanilla:
    kind: SOULBIND_UNBIND_TOOL
    use-type: vanilla
    vanilla-material: SHEARS
    vanilla-name: "&c각인 해제 도구"
    vanilla-lore:
      - "&7각인된 아이템 위에 드래그-드랍하여"
      - "&7영혼각인을 &c해제&7합니다."
      - ""
      - "&e[드래그-드랍 사용]"
    soulbind:
      enabled: true
      duration-minutes: 0

  soulbind_unbind_mmo:
    kind: SOULBIND_UNBIND_TOOL
    use-type: mmoitems
    mmoitems-type: "consumable"
    mmoitems-id: "각인해제기"
    soulbind:
      enabled: true
      duration-minutes: 0